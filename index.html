<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Village</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#E3A23D" />
    <meta name="description" content="One Village — Trouvez des prestataires de confiance à Bertoua. Find trusted service providers in Bertoua." />

    <!-- Open Graph (WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="One Village" />
    <meta property="og:title" content="One Village" />
    <meta property="og:description" content="Trouvez des prestataires de confiance à Bertoua. Find trusted service providers in Bertoua." />
    <!-- TODO: replace with the final production domain once confirmed. og:image and og:url must be
         absolute URLs for link previews to render correctly on WhatsApp/Facebook/etc. -->
    <meta property="og:image" content="https://REPLACE_WITH_PRODUCTION_DOMAIN.com/og-image.jpg" />
    <meta property="og:url" content="https://REPLACE_WITH_PRODUCTION_DOMAIN.com/" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card (falls back to the og: tags above on most platforms, but set explicitly too) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="One Village" />
    <meta name="twitter:description" content="Trouvez des prestataires de confiance à Bertoua. Find trusted service providers in Bertoua." />
    <meta name="twitter:image" content="https://REPLACE_WITH_PRODUCTION_DOMAIN.com/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

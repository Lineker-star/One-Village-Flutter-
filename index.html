<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>One Village</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FBF7F0" />
    <!-- PWA / native-app presentation -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph (WhatsApp, Facebook, etc.) -->

    <meta property="og:site_name" content="One Village" />
    <meta property="og:title" content="One Village" />
    <meta property="og:description" content="Trouvez des prestataires de confiance à Bertoua. Find trusted service providers in Bertoua." />

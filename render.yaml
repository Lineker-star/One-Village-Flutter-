# Render Blueprint — One Village
#
# This file lives at the repo root. When you click "Deploy using Blueprint" in the Render
# Dashboard (or import this repo via Render's Git integration), Render reads this file and
# provisions the web service automatically — no manual form-filling required.
#
# How it maps to this project:
#   * type: web  → Render Web Service (long-running HTTP process, not a static site).
#   * runtime: docker → builds the Dockerfile at the repo root. The Dockerfile compiles
#     TypeScript, bundles the server with esbuild, and serves the static dist/ output.
#   * buildCommand: npm run build  → produces dist/index.html + dist/server.cjs.
#   * startCommand: node dist/server.cjs  → the production entry point (server.ts skips
#     the Vite dev middleware when NODE_ENV=production, see server.ts:1579).
#   * envVars below are REQUIRED at runtime. The two VITE_* ones are PUBLIC (safe to bake
#     into the client bundle); the three SERVER_* ones are secrets and must be set in the
#     Render Dashboard as "Secret" variables — never committed to the repo.
#
# Auto-deploy: every push to the `main` branch triggers a fresh build + zero-downtime
# deploy. To disable, flip autoDeploy to false on the service's Settings page.
services:
  - type: web
    name: onevillage
    runtime: docker
    repo: https://github.com/Lineker-star/One-Village-Flutter-
    branch: main
    dockerfile: Dockerfile
    buildCommand: npm run build
    startCommand: node dist/server.cjs
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # --- Public (client-side) ---
      - key: VITE_SUPABASE_URL
        value: https://meqegazofwxrzvviixhl.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_XSBsyqdON0_PTjn1BhfP5w_eX79Sbf-
      # --- Server-side secrets (set these in the Render Dashboard, NOT here) ---
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_REST_API_KEY
        sync: false
    # Render assigns PORT dynamically; server.ts reads process.env.PORT and binds 0.0.0.0.
    # The Dockerfile EXPOSEs 10000 as a hint; the CMD falls back to 3000 locally.
    port: 10000